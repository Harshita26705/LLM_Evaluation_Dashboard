<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LLM Evaluation Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Header/Navigation -->
    <header class="header">
        <a href="/" class="logo">
            <i class="fa-solid fa-puzzle-piece logo-icon"></i>
            <span class="logo-text">LLM Evaluator</span>
        </a>
        <i class="fa-solid fa-bars" id="menu-icon"></i>
        <nav class="navbar">
            <a href="/" class="nav-link{% if request.path == '/' %} active{% endif %}">Home</a>
            <a href="/#features" class="nav-link">Features</a>
            <a href="/#about" class="nav-link">About</a>
            <a href="/dashboard" class="nav-link{% if request.path.startswith('/dashboard') %} active{% endif %}">Dashboard</a>
            <a href="/history" class="nav-link{% if request.path.startswith('/history') %} active{% endif %}">History</a>
            <a href="/analytics" class="nav-link{% if request.path.startswith('/analytics') %} active{% endif %}">Analytics</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 LLM Evaluation Dashboard. All rights reserved.</p>
            <div class="footer-links">
                <a href="https://github.com/Harshita26705/LLM_Evaluation_Dashboard" target="_blank" title="Project Repository"><i class="fa-brands fa-github"></i></a>
                <a href="/learn-more" title="Learn More"><i class="fa-solid fa-book"></i></a>
                <a href="/history" title="History"><i class="fa-solid fa-clock-rotate-left"></i></a>
                <a href="/analytics" title="Analytics"><i class="fa-solid fa-chart-simple"></i></a>
                <a href="/dashboard" title="Go to Dashboard"><i class="fa-solid fa-chart-line"></i></a>
            </div>
        </div>
        <div class="footer-icon">
            <a href="#home" id="scroll-top"><i class="fa-solid fa-angle-up"></i></a>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
